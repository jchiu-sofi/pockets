<style>

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {

        }

            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;

<body class="bg-surface text-on-surface font-body-md font-body-md antialiased relative min-h-screen flex flex-col">
<!-- Top Navigation (Sheet Header) -->
<header class="flex justify-between items-center px-container-margin w-full bg-surface-container-lowest h-[64px] border-b border-outline-variant sticky top-0 z-10">
<div class="w-10"></div> <!-- Spacer for centering -->
<h1 class="font-label-md text-label-md font-semibold">New pocket</h1>
<button aria-label="Close" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow px-container-margin pt-6 pb-32 max-w-2xl mx-auto w-full">
<h2 class="font-headline-lg text-headline-lg mb-8">What's this pocket for?</h2>
<!-- Templates Grid -->
<section class="mb-8">
<h3 class="font-eyebrow text-eyebrow text-on-surface-variant uppercase mb-4">START FROM A TEMPLATE</h3>
<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
<button class="flex items-center gap-2 p-3 rounded-xl border-2 border-primary bg-primary-fixed-dim bg-opacity-10 transition-colors">
<span class="text-xl">🍜</span>
<span class="font-label-md text-label-md">Food</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">🛒</span>
<span class="font-label-md text-label-md">Groceries</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">🏠</span>
<span class="font-label-md text-label-md text-left leading-tight">Rent &amp; Utilities</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">📚</span>
<span class="font-label-md text-label-md text-left leading-tight">Books &amp; Supplies</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">🚌</span>
<span class="font-label-md text-label-md">Transit</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">🎬</span>
<span class="font-label-md text-label-md">Subscriptions</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">🎉</span>
<span class="font-label-md text-label-md">Going Out</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">🧺</span>
<span class="font-label-md text-label-md">Laundry</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">✈️</span>
<span class="font-label-md text-label-md">Travel</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">💊</span>
<span class="font-label-md text-label-md">Health</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">🐣</span>
<span class="font-label-md text-label-md">Emergency</span>
</button>
<button class="flex items-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-lowest hover:border-outline-variant transition-colors">
<span class="text-xl">✨</span>
<span class="font-label-md text-label-md">Custom</span>
</button>
</div>
</section>
<!-- Name Input -->
<section class="mb-8">
<h3 class="font-eyebrow text-eyebrow text-on-surface-variant uppercase mb-4">NAME</h3>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" placeholder="e.g. Spring Break" type="text" value="Food"/>
</div>
</section>
<!-- Color Selection -->
<section class="mb-8">
<h3 class="font-eyebrow text-eyebrow text-on-surface-variant uppercase mb-4">COLOR</h3>
<div class="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
<button aria-label="Select Cyan color" class="w-11 h-11 rounded-full bg-primary-container flex-shrink-0 ring-2 ring-primary ring-offset-2 ring-offset-surface relative">
<span class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-sm">check</span>
</span>
</button>
<button aria-label="Select Red color" class="w-11 h-11 rounded-full bg-[#E57373] flex-shrink-0 hover:scale-110 transition-transform"></button>
<button aria-label="Select Green color" class="w-11 h-11 rounded-full bg-[#81C784] flex-shrink-0 hover:scale-110 transition-transform"></button>
<button aria-label="Select Yellow color" class="w-11 h-11 rounded-full bg-[#FFD54F] flex-shrink-0 hover:scale-110 transition-transform"></button>
<button aria-label="Select Purple color" class="w-11 h-11 rounded-full bg-[#9575CD] flex-shrink-0 hover:scale-110 transition-transform"></button>
<button aria-label="Select Teal color" class="w-11 h-11 rounded-full bg-[#4DB6AC] flex-shrink-0 hover:scale-110 transition-transform"></button>
<button aria-label="Select Orange color" class="w-11 h-11 rounded-full bg-[#FF8A65] flex-shrink-0 hover:scale-110 transition-transform"></button>
<button aria-label="Select Brown color" class="w-11 h-11 rounded-full bg-[#A1887F] flex-shrink-0 hover:scale-110 transition-transform"></button>
</div>
</section>
<!-- Monthly Amount -->
<section class="mb-10 text-center">
<h3 class="font-eyebrow text-eyebrow text-on-surface-variant uppercase mb-6 text-left">MONTHLY AMOUNT</h3>
<div class="flex items-center justify-center gap-6 mb-4">
<button class="w-12 h-12 rounded-full bg-surface-container-lowest border border-outline-variant flex items-center justify-center text-primary hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="relative flex items-baseline justify-center">
<span class="font-balance-display text-balance-display text-primary mr-1">$</span>
<input class="w-32 bg-transparent border-none text-center font-balance-display text-balance-display p-0 focus:ring-0" style="font-size: 44px;" type="number" value="300"/>
</div>
<button class="w-12 h-12 rounded-full bg-surface-container-lowest border border-outline-variant flex items-center justify-center text-primary hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<p class="font-label-md text-label-md text-on-surface-variant">You have <span class="text-on-surface font-semibold">$212.60</span> unallocated</p>
</section>
<!-- Auto-Fund -->
<section class="mb-8">
<h3 class="font-eyebrow text-eyebrow text-on-surface-variant uppercase mb-4">AUTO-FUND</h3>
<div class="bg-surface-container-lowest p-5 rounded-[20px] shadow-[0px_4px_20px_rgba(32,23,71,0.06)]">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-on-surface font-semibold">Refill from every deposit</span>
<!-- Custom Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<p class="font-body-md text-body-md text-sm text-on-surface-variant">Rent and Books fill first, then this pocket.</p>
</div>
</section>
<!-- Sharing -->
<section class="mb-8">
<div class="flex gap-4">
<button class="flex-1 p-5 rounded-[20px] bg-surface-container-lowest border-2 border-primary shadow-[0px_4px_20px_rgba(32,23,71,0.06)] flex flex-col items-center justify-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">person</span>
<span class="font-label-md text-label-md font-semibold">Just me</span>
</button>
<button class="flex-1 p-5 rounded-[20px] bg-surface-container-lowest border border-transparent shadow-[0px_4px_20px_rgba(32,23,71,0.06)] flex flex-col items-center justify-center gap-2 hover:border-outline-variant transition-colors">
<div class="flex -space-x-2">
<div class="w-8 h-8 rounded-full bg-secondary-container border-2 border-surface-container-lowest flex items-center justify-center z-20">
<span class="material-symbols-outlined text-on-secondary-container text-sm">person</span>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant border-2 border-surface-container-lowest flex items-center justify-center z-10">
<span class="material-symbols-outlined text-on-surface-variant text-sm">group_add</span>
</div>
</div>
<span class="font-label-md text-label-md font-semibold text-on-surface-variant">Share with friends</span>
</button>
</div>
</section>
</main>
<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 left-0 w-full p-container-margin bg-gradient-to-t from-surface via-surface to-transparent pt-12 pb-8 z-50">
<div class="max-w-2xl mx-auto">
<button class="w-full py-4 rounded-full bg-primary text-on-primary font-label-md text-label-md font-bold shadow-lg hover:bg-opacity-90 transition-opacity flex items-center justify-center gap-2">
                Create pocket
            </button>
</div>
</div>
